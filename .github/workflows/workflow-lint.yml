name: Workflow lint

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runner-local toolchain: no project-wide mise.toml, no app language runtime.
      - name: Install jactionlint
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          mise_toml: |
            [tools]
            jactionlint = "1.8.2"

      - name: Problem matcher
        run: echo "::add-matcher::.github/jactionlint-matcher.json"

      - name: jactionlint
        run: |
          jactionlint -version
          jactionlint
